name: Publish scheduled content

on:
  # The Mac launchd scheduler is authoritative and reads local Studio drafts.
  # Keep this as a deliberate disaster-recovery action to avoid two writers racing.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scheduled-publishing
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - run: bun run publish:scheduled
      - run: bun run verify:content
      - name: Commit due content
        run: |
          if git diff --quiet -- src/content; then
            echo "No scheduled content is due."
            exit 0
          fi
          git config user.name "GM Studio Scheduler"
          git config user.email "actions@users.noreply.github.com"
          git add src/content
          git commit -m "publish: release scheduled content"
          git push
