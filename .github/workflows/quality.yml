name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install font tools
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check fonttools brotli

      - name: Install dependencies
        env:
          HUSKY: '0'
        run: bun install --frozen-lockfile

      - name: Check formatting and lint
        run: bun run format:check

      - name: Build production site
        run: PATH=.venv/bin:$PATH bun run build

      - name: Verify build output
        run: bun run verify:build
