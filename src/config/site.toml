]

[config.home.intro]
title = "我是"
name = "Gou Min"
body = [
  "一名嵌入式系统工程师，主要和 Bootloader、Linux BSP、存储驱动以及 SoC Bring-up 打交道。",
  "我习惯从启动日志、寄存器和源码一路追到问题根因，再把解决过程整理成可以复用的笔记。",
  "这里记录技术实践、设备折腾和一些生活片段。希望每篇记录，都能在下次遇到类似问题时派上用场。",
]

