[config.site]
title = "Gou Min"
description = "Gou Min 的中文个人站，记录嵌入式系统、Linux、开发板、存储与生活。"
pageTitle = "Gou Min｜嵌入式系统与个人笔记"
pageDescription = "嵌入式系统工程师 Gou Min 的个人站，记录 Linux、驱动、开发板、存储和日常思考。"
url = "https://goumin.work"
repository = "https://github.com/GM2020JLU/GM-WEB"
footerNote = "记录技术，也记录生活。"

[config.theme]
# 可用色盘：
# green-soft, green-vivid, rose-soft, pink-soft, purple-soft, blue-soft, orange-soft, brown-soft
palette = "blue-soft"
# 原生 UI 语言。可用值：en、zh-CN、zh-TW。未知值会回退到 en。
lang = "zh-CN"

[config.fonts]
# 英文与代码感 UI 字体
en = "Maple Mono"
code = "Monaco"
# 模板内可直接选择：ChillRoundM、LXGW WenKai
# 中文阅读字体
zh = "LXGW WenKai"
# 浏览器使用的完整 WOFF2，以及构建子集时使用的 TTF 源文件。
file = "/fonts/LXGWWenKai-Regular.woff2"
source = "/fonts/LXGWWenKai-Regular.ttf"

[config.code]
lightTheme = "catppuccin-latte"
darkTheme = "catppuccin-macchiato"
lineNumbers = true
wrap = true
preserveIndent = true
collapseStyle = "collapsible-auto"

[config.math]
render = "katex" # "katex" | "mathjax"

[config.comments]
enabled = false
provider = "none"
show_on_posts = true

[config.search]
enabled = true
shortcut = "mod+k"
placeholder = "搜索文章、项目和随记……"
maxResults = 6

[config.pages.blog]
title = "文章"
kicker = "技术笔记"
subtitle = "把解决过的问题，写成下次还能用的经验。"
note = "主要记录嵌入式系统、Linux、驱动开发与工程实践。"
postsPerPage = 6
# date-fns 使用的日期格式模板。
dateFormat = "yyyy-MM-dd"
# 元信息分隔符。可以使用 "|"、"/" 等符号，也可以使用特殊值 "icon"。
metadataSeparator = "icon"
# 文章列表封面样式："card" 保留带边框的缩略图，"mask" 会将图片融合到右侧。
coverImageStyle = "mask"

[config.pages.blog.categories]
title = "分类"
kicker = "按主题浏览"
subtitle = ""
note = "按技术方向整理的文章索引。"

[config.pages.blog.series]
title = "系列"
kicker = "按顺序阅读"
subtitle = ""
note = "把同一个问题的多篇记录连成完整路径。"

[config.pages.projects]
title = "项目"
kicker = "工程记录"
subtitle = "不只展示结果，也记下问题、取舍与实现。"
note = "真实项目和个人折腾的长期归档。"

[config.pages.vibe]
title = "随记"
kicker = "日常片段"
subtitle = "不够长成文章，但值得留下的想法。"
note = "关于代码、设备、阅读和生活的短记录。"
showTrail = true

[config.pages.media]
title = "书影音"
subtitle = "读过、看过、听过的作品，以及一点当时的感受。"
note = "一页浏览书、电影、剧集、专辑与播客。"

[config.comments.giscus]
repo = ""
repo_id = ""
category = ""
category_id = ""
mapping = "pathname"
strict = "0"
reactions_enabled = "1"
emit_metadata = "0"
input_position = "top"
light_theme = "light"
dark_theme = "dark"
lang = "zh-CN"
loading = "lazy"

[config.comments.utterances]
repo = ""
issue_term = "pathname"
label = "comment"
theme = "github-light"

[config.comments.waline]
server_url = ""
lang = "zh-CN"
dark = "html.dark"
pageview = true
comment = true

[config.profile]
name = "Gou Min"
handle = "@GM2020JLU"
role = "嵌入式系统 / Linux"
email = "gouminjlu@gmail.com"
website = "https://goumin.work/"
github = "https://github.com/GM2020JLU"
avatar = "https://avatars.githubusercontent.com/u/66173922?v=4"

